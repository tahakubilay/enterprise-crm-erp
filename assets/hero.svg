<svg xmlns="http://www.w3.org/2000/svg" width="900" height="72" viewBox="0 0 900 72" role="img">
  <style>
    .t{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;font-size:21px;font-weight:600;fill:#58a6ff;text-anchor:middle}
    .cursor{fill:#8b949e}
  </style>
  <text class="t" x="450" y="43" opacity="1">CRM and ERP in one operational model
    <animate attributeName="opacity" values="1;1;0;0;0;0" keyTimes="0;0.29;0.33;0.66;0.67;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text class="t" x="450" y="43" opacity="0">Customers, workflows and reporting
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.34;0.62;0.66;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text class="t" x="450" y="43" opacity="0">Enterprise software beyond basic CRUD
    <animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;0.32;0.33;0.65;0.68;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <rect class="cursor" x="790" y="25" width="3" height="24">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>